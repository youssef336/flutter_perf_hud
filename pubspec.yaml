name: flutter_perf_hud
description: >-
  In-app performance HUD for Flutter: FPS, jank, UI/raster thread times, memory,
  oversized images and rebuild counts, with a one-tap Markdown report.
version: 0.1.1
homepage: https://github.com/youssef336/flutter_perf_hud
repository: https://github.com/youssef336/flutter_perf_hud
issue_tracker: https://github.com/youssef336/flutter_perf_hud/issues
topics:
  - performance
  - profiling
  - debugging
  - devtools
  - overlay

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
